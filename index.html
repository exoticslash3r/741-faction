<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Logo with Telegram Buttons</title>
    <style>
        body {
            margin: 0;
            min-height: 200vh;
            background-color: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            overflow-y: scroll;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 50px; /* space between logos */
            margin-bottom: 20px;
        }

        .container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .circle-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
        }

        .circle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rotating-logo {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            animation: spin 1.5s linear infinite;
        }

        .rotating-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .side-logo {
            width: 80px;
            height: 80px;
            animation: spin 2s linear infinite; /* slower rotation */
        }

        .side-logo.left {
            animation-direction: reverse; /* left spins opposite */
        }

        .side-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Text-only buttons */
        .text-button {
            margin-top: 10px;
            font-size: 18px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
            position: relative;
        }

        .text-button::after {
            content: '';
            display: block;
            height: 2px;
            width: 0;
            background: red;
            transition: width 0.3s;
            position: absolute;
            bottom: -5px;
            left: 0;
        }

        .text-button:hover::after {
            width: 100%;
        }

        .text-button:hover {
            color: red;
        }

        /* Glowing red lines */
        .glow-line {
            margin-top: 20px;
            font-size: 16px;
            color: #ff4d4d;
            text-shadow: 0 0 5px #ff4d4d, 0 0 10px #ff1a1a, 0 0 20px #ff4d4d;
            width: 80%;
            display: flex;
            justify-content: space-between;
            max-width: 600px;
        }

        .glow-line span {
            max-width: 45%;
            text-align: left;
        }

        .glow-line span.right {
            text-align: right;
        }

        /* Glowing white description */
        .white-description {
            margin-top: 20px;
            font-size: 16px;
            color: white;
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #fff;
            max-width: 500px;
            line-height: 1.4;
        }

        /* Black overlay for delay effect */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 9999;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
    </style>
</head>
<body>
    <!-- Logo row -->
    <div class="logo-row">
        <!-- Left spinning logo -->
        <div class="side-logo left">
            <img src="https://i.postimg.cc/4dj8BDLb/image.png" alt="Left Spinning Logo">
        </div>

        <div class="container">
            <div class="rotating-logo">
                <img src="https://i.postimg.cc/hjDTLp1P/image.png" alt="Rotating Logo">
            </div>
            <div class="circle-image">
                <img src="https://i.postimg.cc/Fzp5knR3/cool.jpg" alt="Main Image">
            </div>
        </div>

        <!-- Right spinning logo -->
        <div class="side-logo right">
            <img src="https://i.postimg.cc/SxbrXL3m/image.png" alt="Right Spinning Logo">
        </div>
    </div>

    <!-- Buttons below the image -->
    <a href="https://t.me/+iX02ujnpPkwxYTQ0" class="text-button" onclick="delayRedirect(event, this.href)">Telegram Server</a>
    <a href="https://t.me/reu_741bot" class="text-button" onclick="delayRedirect(event, this.href)">Telegram Bot</a>

    <!-- Glowing red lines -->
    <div class="glow-line">
        <span class="left">Join our Telegram server to chat with members and stay updated.</span>
        <span class="right">Use our Telegram bot to get instant updates and special features.</span>
    </div>

    <!-- Glowing white description -->
    <div class="white-description">
        Stay connected with the latest news, events, and updates. Our community is always active and ready to welcome you!
    </div>

    <!-- Black overlay -->
    <div class="overlay" id="overlay"></div>

    <script>
        function delayRedirect(event, url) {
            event.preventDefault(); // prevent immediate redirect
            const overlay = document.getElementById('overlay');
            overlay.classList.add('active'); // show black overlay
            setTimeout(() => {
                window.location.href = url; // redirect after 1 second
            }, 1000);
        }
    </script>
</body>
</html>
